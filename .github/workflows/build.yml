name: Application builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'observability/**'
      - '.github/workflows/build.yml'
      - 'tools/**'

permissions:
  contents: read

jobs:
  nomenclatura:
    # O prefixo `ces` (sistema de origem) não volta ao código: use `geo`.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do script de renomeação
        run: node --test tools/renomear-geo.test.mjs
      - name: Nenhum identificador ces
        run: node tools/renomear-geo.mjs --check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        application: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --tag geo-${{ matrix.application }}:ci ./${{ matrix.application }}

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache-dependency-path: observability/probes/go.sum
      - name: Test adapter and probes
        working-directory: observability/probes
        run: go test ./...
      - name: Validate synthetic runner
        working-directory: observability/synthetics
        run: npm ci && npm run check
      - name: Validate catalog coverage
        shell: pwsh
        working-directory: observability
        run: ./scripts/validate_catalog.ps1
      - name: Validate Compose contracts
        working-directory: observability
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file sentinel/.env.example --file sentinel/compose.yaml config --quiet
      - name: Build observability images with fake transport
        working-directory: observability
        env:
          ALERT_TRANSPORT: fake
        run: |
          docker build --tag geo-gatus:ci ./gatus
          docker build --tag geo-observability-probes:ci ./probes
          docker build --tag geo-observability-synthetics:ci ./synthetics
