<section class="home" aria-labelledby="home-title">
  <h1 id="home-title" class="home__title">Módulos</h1>

  @if (modules().length) {
    <nav class="module-grid" aria-labelledby="home-title">
      @for (module of modules(); track module.route) {
        <a class="module-card" [routerLink]="module.route">
          <span class="module-card__icon" aria-hidden="true">
            <geo-icon [name]="module.icon" size="lg" />
          </span>
          <span class="module-card__copy">
            <strong>{{ module.name }}</strong>
            <small>{{ module.description }}</small>
          </span>
          <geo-icon class="module-card__arrow" name="arrow-right" size="sm" />
        </a>
      }
    </nav>
  } @else {
    <p class="home__empty">
      Seu perfil ainda não tem acesso a nenhum módulo. Peça a liberação ao administrador do sistema.
    </p>
  }
</section>
