<div class="flex flex-col h-screen overflow-hidden bg-[var(--geo-canvas)] text-[var(--geo-foreground)] font-sans print:h-auto print:overflow-visible" >
  <p-toast class="print:hidden">
    <ng-template #message let-aviso>
      <i [class]="iconeAviso(aviso.severity)" aria-hidden="true"></i>
      <div class="p-toast-message-text">
        <div class="p-toast-summary">{{ aviso.summary }}</div>
        <div class="p-toast-detail">{{ aviso.detail }}</div>
        @if (aviso.data?.geoAction; as acao) {
          <geo-button class="mt-2 block" variant="outline" size="sm" [label]="acao.label" (pressed)="notificacoes.runAction(acao)"></geo-button>
        }
      </div>
    </ng-template>
  </p-toast>
  @if (auth.isAuthenticated()) {
    <p-confirmdialog
      class="print:hidden"
      header="Confirmação"
      styleClass="geo-dialog geo-confirm-dialog"
    ></p-confirmdialog>
  }
  @if (auth.isAuthenticated() && !hideLayout()) {
    <app-mural-host class="print:hidden"></app-mural-host>
    <app-sessao-reautenticacao></app-sessao-reautenticacao>

    <div class="flex flex-grow min-h-0 relative print:block">
      @if (menuVisible() && isMobile()) {
        <div
          class="geo-shell__fundo print:hidden"
          animate.enter="geo-enter-fade"
          animate.leave="geo-leave-fade"
          (click)="toggleMenu()"
        ></div>
      }

      <app-sidebar
        class="print:hidden"
        [isMobile]="isMobile()"
        [menuVisible]="menuVisible()"
        [menuItems]="menuItems()"
        (toggleMenu)="toggleMenu()"
        (expandAndFocus)="expandAndFocus($event)"
      ></app-sidebar>

      <div class="flex-grow flex flex-col min-w-0 overflow-hidden relative print:overflow-visible">
        <app-header
          class="print:hidden"
          [isMobile]="isMobile()"
          [menuItems]="menuItems()"
          (toggleMenu)="toggleMenu()"
          (logout)="logout()"
        ></app-header>
        <main appScrollMemory="main" class="geo-shell__conteudo flex-grow overflow-y-auto bg-[var(--geo-canvas)] p-4 lg:p-6 custom-scrollbar print:overflow-visible print:h-auto print:p-0" [class.geo-main--full-bleed]="layoutFullBleed()" [class.!p-0]="layoutFullBleed()" [class.!overflow-hidden]="layoutFullBleed()">
          <router-outlet></router-outlet>
        </main>
      </div>
    </div>
  } @else {
    <main appScrollMemory="tela-cheia" class="w-full h-full overflow-y-auto bg-[var(--geo-surface)] print:h-auto print:overflow-visible relative">
      @if (activeDataSource(); as ds) {
        <geo-report-navigator
          [dataSource]="ds"
          [currentId]="currentRouteId()"
          [opened]="reportNavigatorOpen()"
          (openedChange)="reportNavigatorOpen.set($event)"
        ></geo-report-navigator>
        <div class="report-content-container md:pl-14 print:pl-0">
          <router-outlet></router-outlet>
        </div>
      } @else {
        <router-outlet></router-outlet>
      }
    </main>
  }
  
  <!-- Fora de qualquer @if: a aba com build antigo quebra igual em tela logada, na de
       login e nos relatórios em tela cheia. Quem decide se aparece é o serviço. -->
  <app-atualizacao-disponivel class="print:hidden"></app-atualizacao-disponivel>

  <!-- Avaliação do GEO: o convite cede a vez ao aviso de versão nova (mesmo canto). -->
  @if (auth.isAuthenticated()) {
    <app-avaliacao-convite></app-avaliacao-convite>
    <app-avaliacao-drawer></app-avaliacao-drawer>
  }
</div>
